apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap 
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="it">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>#151 Mew — Archivio GitOps</title>
      <style>
        :root {
          --mew-pink: #f4a4c0;
          --mew-pink-dark: #d97298;
          --mew-bg: #fff5f8;
          --mew-eye: #29a3d6;
          --text: #3d2431;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: radial-gradient(circle at top, #ffe3ee 0%, var(--mew-bg) 60%, #e8f6fc 100%);
          color: var(--text);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }
        .card {
          background: rgba(255, 255, 255, 0.92);
          border: 2px solid var(--mew-pink);
          border-radius: 24px;
          max-width: 540px;
          width: 100%;
          padding: 32px;
          box-shadow: 0 18px 40px rgba(217, 114, 152, 0.22);
          text-align: center;
        }
        .badge {
          display: inline-block;
          background: var(--mew-pink);
          color: #fff;
          font-weight: 700;
          font-size: 0.85rem;
          padding: 5px 14px;
          border-radius: 999px;
          letter-spacing: 0.5px;
          margin-bottom: 14px;
        }
        h1 {
          font-size: 2.2rem;
          color: var(--mew-pink-dark);
          margin-bottom: 6px;
        }
        .subtitle {
          color: var(--mew-eye);
          font-weight: 600;
          margin-bottom: 20px;
        }
        .orb {
          width: 96px;
          height: 96px;
          margin: 0 auto 20px;
          border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #ffd6e6, var(--mew-pink) 65%, var(--mew-pink-dark));
          box-shadow: 0 0 28px rgba(244, 164, 192, 0.8), 0 0 50px rgba(41, 163, 214, 0.25);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 2.4rem;
          color: #fff;
        }
        p {
          line-height: 1.6;
          margin-bottom: 22px;
          font-size: 0.98rem;
        }
        .stats {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 20px;
        }
        .stat {
          background: var(--mew-bg);
          border: 1px solid #f8cada;
          border-radius: 14px;
          padding: 12px 8px;
        }
        .stat span {
          display: block;
          font-size: 0.75rem;
          color: #8a5a70;
          text-transform: uppercase;
        }
        .stat strong {
          font-size: 1.15rem;
          color: var(--mew-pink-dark);
        }
        .footer {
          font-size: 0.8rem;
          color: #8a5a70;
          border-top: 1px dashed var(--mew-pink);
          padding-top: 14px;
        }
      </style>
    </head>
    <body>
      <main class="card">
        <div class="badge">POKÉDEX #151 • TIPO PSICO</div>
        <div class="orb">✦</div>
        <h1>Mew</h1>
        <div class="subtitle">Pokémon Novaspecie • Antenato di tutti i Pokémon</div>
        <p>
          Secondo gli studi genetici, il DNA di Mew contiene il codice genetico di ogni singolo Pokémon:
          per questo motivo è in grado di apprendere qualsiasi mossa esistente e rendersi invisibile a volontà.
        </p>
        <div class="stats">
          <div class="stat"><span>Altezza</span><strong>0,4 m</strong></div>
          <div class="stat"><span>Peso</span><strong>4,0 kg</strong></div>
          <div class="stat"><span>Stat. Base</span><strong>600 Tot</strong></div>
        </div>
        <div class="footer">
          Servito da Nginx su Minikube • Sincronizzato via ArgoCD
        </div>
      </main>
    </body>
    </html>